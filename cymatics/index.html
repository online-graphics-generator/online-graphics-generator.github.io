<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cymatics Simulation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 1px solid #333;
            margin-top: 20px;
            background-color: #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        input[type="number"] {
            padding: 5px;
            font-size: 16px;
            width: 120px;
            text-align: center;
        }

        label {
            font-size: 18px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="m">Mode Number m:</label>
        <input type="number" id="m" value="2" min="1" max="10">
        <label for="n">Mode Number n:</label>
        <input type="number" id="n" value="3" min="1" max="10">
        <label for="a">Coefficient a:</label>
        <input type="number" id="a" value="1" step="0.1">
        <label for="b">Coefficient b:</label>
        <input type="number" id="b" value="1" step="0.1">
        <button onclick="startSimulation()">Start Simulation</button>
    </div>
    <canvas id="cymaticsCanvas" width="1000" height="1000"></canvas>

    <script>
        const canvas = document.getElementById('cymaticsCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        let animationFrameId;

        function drawCymatics(m, n, a, b) {
            const resolution = 2; // Particle spacing
            ctx.clearRect(0, 0, width, height);

            for (let x = 0; x < width; x += resolution) {
                for (let y = 0; y < height; y += resolution) {
                    const normX = x / width;
                    const normY = y / height;

                    const z = a * Math.sin(Math.PI * n * normX) * Math.sin(Math.PI * m * normY) +
                              b * Math.sin(Math.PI * m * normX) * Math.sin(Math.PI * n * normY);

                    const intensity = Math.abs(z);
                    const color = Math.floor(intensity * 255);
                    ctx.fillStyle = `rgb(${color}, ${color}, ${color})`;
                    ctx.fillRect(x, y, resolution, resolution);
                }
            }
        }

        function startSimulation() {
            const mInput = document.getElementById('m');
            const nInput = document.getElementById('n');
            const aInput = document.getElementById('a');
            const bInput = document.getElementById('b');

            const m = parseInt(mInput.value);
            const n = parseInt(nInput.value);
            const a = parseFloat(aInput.value);
            const b = parseFloat(bInput.value);

            if (isNaN(m) || isNaN(n) || isNaN(a) || isNaN(b)) {
                alert('Please enter valid parameters.');
                return;
            }

            function animate() {
                drawCymatics(m, n, a, b);
                animationFrameId = requestAnimationFrame(animate);
            }

            cancelAnimationFrame(animationFrameId);
            animate();
        }

        // Stop simulation when the page is closed or navigated away
        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
