<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <title>Relief Sculptor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b; color: #d6fcd6;
      font-family: "Gill Sans", "Trebuchet MS", sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    .panel-draw {
      width: 480px; flex-shrink: 0; display: flex; flex-direction: column;
      padding: 14px; gap: 9px; border-right: 1px solid #1a2a1a; overflow-y: auto;
    }
    h2 { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; opacity: .4; }
    .canvas-wrap { position: relative; width: 100%; aspect-ratio: 1; flex-shrink: 0; }
    .canvas-wrap canvas { position: absolute; top:0; left:0; width:100%; height:100%; display:block; }
    #draw { cursor: crosshair; border: 1px solid #1a3a1a; }
    #overlay { pointer-events: none; }
    .row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 5px; flex-wrap: wrap; }
    label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .5; flex-shrink: 0; }
    input[type=range] { accent-color: #50d08a; flex: 1; min-width: 55px; }
    select {
      background: #0f1f0f; color: #d6fcd6; border: 1px solid #2a4a2a;
      padding: 4px 7px; font-size: 11px; font-family: inherit; outline: none;
    }
    button {
      background: #0f1f0f; color: #d6fcd6; border: 1px solid #2a4a2a;
      padding: 4px 9px; font-size: 10px; cursor: pointer;
      text-transform: uppercase; letter-spacing: .05em; font-family: inherit; white-space: nowrap;
    }
    button:hover  { background: #1a2a1a; }
    button.active { background: #1a3a1a; border-color: #50d08a; color: #80ff80; }
    .val { font-size: 10px; opacity: .65; min-width: 26px; flex-shrink: 0; }
    #panel-3d { flex: 1; position: relative; min-width: 0; }
    #view { display: block; cursor: grab; }
    #view.dragging { cursor: grabbing; }
    .fhint { position: absolute; bottom: 12px; right: 12px; font-size: 10px; opacity: .22; text-transform: uppercase; letter-spacing: .07em; user-select: none; }
    #back { position: absolute; top: 12px; right: 12px; color: #d6fcd6; opacity: .3; text-decoration: none; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    #back:hover { opacity: .75; }
  </style>
</head>
<body>
  <div class="panel-draw">
    <h2>Relief Sculptor</h2>
    <div class="row">
      <label>Canvas</label>
      <select id="canvas-size">
        <option value="300">300 px</option>
        <option value="400" selected>400 px</option>
        <option value="600">600 px</option>
        <option value="800">800 px</option>
      </select>
      <label>Grid</label>
      <input type="range" id="grid-res" min="20" max="100" value="50">
      <span class="val" id="grid-val">50</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="draw"    width="400" height="400"></canvas>
      <canvas id="overlay" width="400" height="400"></canvas>
    </div>
    <div class="toolbar" id="toolbar">
      <button data-tool="raise-soft" class="active" title="Soft raise">Raise</button>
      <button data-tool="raise-hard" title="Hard-edge raise">Hard</button>
      <button data-tool="smooth"     title="Smooth / blur">Smooth</button>
      <button data-tool="erase"      title="Erase height">Erase</button>
      <button data-tool="precise"    title="Stamp exact height (grid-snap)">Precise</button>
    </div>
    <div class="row">
      <label>Brush</label>
      <input type="range" id="brush-size" min="4" max="120" value="20">
      <label>Strength</label>
      <input type="range" id="strength" min="1" max="10" value="5">
    </div>
    <div class="row" id="precise-row" hidden>
      <label>Set height</label>
      <input type="range" id="precise-h" min="0" max="100" value="100">
      <span class="val" id="precise-val">100%</span>
    </div>
    <div class="row">
      <label>Relief</label>
      <input type="range" id="height-scale" min="0" max="20" value="8">
      <button id="btn-random">Random</button>
      <button id="btn-clear">Clear</button>
    </div>
    <div class="row">
      <button id="btn-export">Export JSON</button>
      <button id="btn-world">Send to World</button>
      <button id="btn-world-open">Send + open World</button>
    </div>
    <div id="transfer-status" class="val" style="min-height:12px"></div>
  </div>

  <div id="panel-3d">
    <canvas id="view"></canvas>
    <div class="fhint">Drag to rotate &middot; Scroll to zoom</div>
    <a id="back" href="index.html">&#8592; Back</a>
  </div>

  <script src="studio-core.js"></script>
  <script src="studio-webgl.js"></script>
  <script>
    'use strict';
    const draw    = document.getElementById('draw');
    const dc      = draw.getContext('2d');
    const overlay = document.getElementById('overlay');
    const oc      = overlay.getContext('2d');
    const view    = document.getElementById('view');
    const previewRenderer = window.StudioWebGL?.createRenderer(view, { onInvalidate: () => scheduleRender() });
    const vc      = previewRenderer?.available ? null : view.getContext('2d');
    const panel3d = document.getElementById('panel-3d');

    let ROWS = 50, COLS = 50;
    let heights = new Float32Array(ROWS * COLS);
    let activeTool = 'raise-soft';
    let brushSize = 20, strength = 5, precisionH = 1.0, heightScale = 0.8;
    let vAngX = 0.70, vAngY = 0.30, vZoom = 2.5;
    let painting = false, vDragging = false, vLastX = 0, vLastY = 0;
    let renderPending = false, showGrid = false;
    let geometryRevision = 1, previewAsset = null, previewAssetRevision = -1, lastWorldSendRevision = -1;

    // 8-level gradient palette dark -> bright green
    const PAL = ['#111a12','#1b3022','#26472f','#315e3d','#3d774d','#4a925f','#57ae73','#65cc88'];

    const resizeView = () => { const dpr=Math.min(2,devicePixelRatio||1); view.width = Math.max(1,Math.round(panel3d.clientWidth*dpr)); view.height = Math.max(1,Math.round(panel3d.clientHeight*dpr)); view.style.width=panel3d.clientWidth+'px'; view.style.height=panel3d.clientHeight+'px'; renderScene(); };
    window.addEventListener('resize', resizeView);

    function initCanvas(size) {
      draw.width = draw.height = overlay.width = overlay.height = size;
      dc.fillStyle = '#0b0b0b'; dc.fillRect(0, 0, size, size);
      oc.clearRect(0, 0, size, size);
    }

    function initGrid(n) {
      ROWS = COLS = n;
      heights = new Float32Array(ROWS * COLS);
      syncDraw(); scheduleRender();
    }

    // Write heights array to draw canvas as greyscale image
    function syncDraw() {
      geometryRevision += 1;
      const w = draw.width, h = draw.height;
      const img = dc.createImageData(w, h);
      const d = img.data;
      for (let py = 0; py < h; py++) {
        const r = (py * ROWS / h) | 0;
        for (let px = 0; px < w; px++) {
          const v = heights[r * COLS + ((px * COLS / w) | 0)] * 255 | 0;
          const i = (py * w + px) << 2;
          d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
        }
      }
      dc.putImageData(img, 0, 0);
      drawGrid();
    }

    function drawGrid() {
      oc.clearRect(0, 0, overlay.width, overlay.height);
      if (!showGrid) return;
      const cw = overlay.width / COLS, ch = overlay.height / ROWS;
      oc.strokeStyle = 'rgba(80,220,130,.18)'; oc.lineWidth = 0.5;
      oc.beginPath();
      for (let c = 0; c <= COLS; c++) { oc.moveTo(c*cw, 0); oc.lineTo(c*cw, overlay.height); }
      for (let r = 0; r <= ROWS; r++) { oc.moveTo(0, r*ch); oc.lineTo(overlay.width, r*ch); }
      oc.stroke();
    }

    function updateHover(mx, my) {
      drawGrid();
      if (activeTool !== 'precise' || mx < 0 || my < 0) return;
      const cw = overlay.width / COLS, ch = overlay.height / ROWS;
      const c = Math.min(COLS-1, Math.max(0, mx * COLS / overlay.width | 0));
      const r = Math.min(ROWS-1, Math.max(0, my * ROWS / overlay.height | 0));
      oc.fillStyle = 'rgba(80,220,130,.28)';
      oc.fillRect(c*cw, r*ch, cw, ch);
      oc.fillStyle = '#90ffb0';
      oc.font = (Math.max(8, Math.min(11, cw * .55)) | 0) + 'px monospace';
      oc.fillText((heights[r*COLS+c]*100|0)+'%', c*cw+2, (r+1)*ch-3);
    }

    function bbox(cx, cy) {
      const cw = draw.width / COLS, ch = draw.height / ROWS;
      return {
        r0: Math.max(0, Math.floor((cy - brushSize) / ch)),
        r1: Math.min(ROWS-1, Math.ceil((cy + brushSize) / ch)),
        c0: Math.max(0, Math.floor((cx - brushSize) / cw)),
        c1: Math.min(COLS-1, Math.ceil((cx + brushSize) / cw)),
        cw, ch
      };
    }

    function applySoft(cx, cy, dir) {
      const { r0,r1,c0,c1,cw,ch } = bbox(cx, cy);
      const R2 = brushSize*brushSize, rate = (strength/10)*0.055*dir;
      for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++) {
        const dx=(c+.5)*cw-cx, dy=(r+.5)*ch-cy, d2=dx*dx+dy*dy;
        if (d2 >= R2) continue;
        const t = 1-d2/R2;
        const i = r*COLS+c;
        heights[i] = Math.max(0, Math.min(1, heights[i] + t*t*(3-2*t)*rate));
      }
    }

    function applyHard(cx, cy, dir) {
      const { r0,r1,c0,c1,cw,ch } = bbox(cx, cy);
      const R2 = brushSize*brushSize, rate = (strength/10)*0.055*dir;
      for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++) {
        const dx=(c+.5)*cw-cx, dy=(r+.5)*ch-cy;
        if (dx*dx+dy*dy >= R2) continue;
        const i = r*COLS+c;
        heights[i] = Math.max(0, Math.min(1, heights[i]+rate));
      }
    }

    function applySmooth(cx, cy) {
      const { r0,r1,c0,c1,cw,ch } = bbox(cx, cy);
      const R2 = brushSize*brushSize, rate = (strength/10)*0.25;
      const tmp = heights.slice();
      for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++) {
        const dx=(c+.5)*cw-cx, dy=(r+.5)*ch-cy, d2=dx*dx+dy*dy;
        if (d2 >= R2) continue;
        const t = 1-d2/R2, f=t*t*(3-2*t)*rate;
        let sum=0, cnt=0;
        for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
          const nr=r+dr, nc=c+dc;
          if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) { sum+=tmp[nr*COLS+nc]; cnt++; }
        }
        const i = r*COLS+c;
        heights[i] = Math.max(0, Math.min(1, heights[i]+(sum/cnt-tmp[i])*f));
      }
    }

    function applyPrecise(cx, cy) {
      const { r0,r1,c0,c1,cw,ch } = bbox(cx, cy);
      const R2 = brushSize*brushSize;
      for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++) {
        const dx=(c+.5)*cw-cx, dy=(r+.5)*ch-cy;
        if (dx*dx+dy*dy < R2) heights[r*COLS+c] = precisionH;
      }
    }

    // Fractal value noise terrain
    function generateTerrain() {
      const S = Math.random()*9999;
      const hash = (x,y) => { const n=Math.sin(x*127.1+y*311.7+S)*43758.5453; return n-Math.floor(n); };
      const noise = (u,v,f) => {
        const fx=u*f, fy=v*f, x0=fx|0, y0=fy|0, xf=fx-x0, yf=fy-y0;
        const sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
        return hash(x0,y0)+(hash(x0+1,y0)-hash(x0,y0))*sx
              +(hash(x0,y0+1)-hash(x0,y0))*sy
              +(hash(x0,y0)+hash(x0+1,y0+1)-hash(x0+1,y0)-hash(x0,y0+1))*sx*sy;
      };
      for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
        heights[r*COLS+c] = Math.min(1,
          noise(c/COLS,r/ROWS,3)*.50+noise(c/COLS,r/ROWS,6)*.30+
          noise(c/COLS,r/ROWS,12)*.14+noise(c/COLS,r/ROWS,24)*.06);
      }
      syncDraw(); scheduleRender();
    }

    // 3D rendering
    const rotX = ({x,y,z},a) => ({x, y:y*Math.cos(a)-z*Math.sin(a), z:y*Math.sin(a)+z*Math.cos(a)});
    const rotY = ({x,y,z},a) => ({x:x*Math.cos(a)+z*Math.sin(a), y, z:-x*Math.sin(a)+z*Math.cos(a)});

    function project(v) {
      const d = v.z+vZoom;
      if (d<.01) return null;
      const f = view.height*.5;
      return { sx: view.width/2+v.x*f/d, sy: view.height/2-v.y*f/d };
    }

    function scheduleRender() {
      if (!renderPending) { renderPending=true; requestAnimationFrame(()=>{ renderPending=false; renderScene(); }); }
    }

    function buildPreviewVertices() {
      const vertices=[];
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) vertices.push([(c/(COLS-1)-.5)*2, heights[r*COLS+c]*heightScale, (r/(ROWS-1)-.5)*2]);
      return vertices;
    }

    function currentPreviewAsset() {
      if (!previewAsset || previewAsset.rows !== ROWS || previewAsset.cols !== COLS) {
        previewAsset = StudioCore.standardiseAsset({ name:'Sculpted relief', type:'heightmap', rows:ROWS, cols:COLS, vertices:buildPreviewVertices(), faces:StudioCore.gridFaces(ROWS,COLS), uvs:StudioCore.gridUvs(ROWS,COLS) });
        previewAssetRevision = geometryRevision;
      } else if (previewAssetRevision !== geometryRevision) {
        previewAsset.vertices = buildPreviewVertices(); previewAssetRevision = geometryRevision;
      }
      return previewAsset;
    }

    function renderScene() {
      if (!view.width||!view.height) return;
      if (previewRenderer?.available) {
        const asset=currentPreviewAsset();
        previewRenderer.render([{ id:'relief-preview', asset, __geometryRevision:geometryRevision, transform:{ position:{x:0,y:0,z:0}, rotation:{x:0,y:0,z:0}, scale:{x:1,y:1,z:1} }, material:{ type:'contour', primary:'#65cc88', secondary:'#14271b', scale:10, roughness:.72 } }], { pitch:vAngX, yaw:vAngY, distance:vZoom, targetY:heightScale*.28 }, { background:'#090d0a', grid:true, wireframe:true, exposure:1.08, ambient:.38, lightIntensity:1.2, rim:.2 });
        return;
      }
      vc.fillStyle='#0b0b0b'; vc.fillRect(0,0,view.width,view.height);

      const pts = new Array(ROWS*COLS);
      for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
        pts[r*COLS+c] = project(rotY(rotX({
          x: (c/(COLS-1)-.5)*2,
          y: heights[r*COLS+c]*heightScale,
          z: (r/(ROWS-1)-.5)*2
        }, vAngX), vAngY));
      }

      // Bucket edges by height into 8 colour levels
      const batches = Array.from({length:8}, ()=>[]);
      for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
        if (c<COLS-1) {
          const h=(heights[r*COLS+c]+heights[r*COLS+c+1])*.5;
          batches[Math.min(7,h*8|0)].push(r*COLS+c, r*COLS+c+1);
        }
        if (r<ROWS-1) {
          const h=(heights[r*COLS+c]+heights[(r+1)*COLS+c])*.5;
          batches[Math.min(7,h*8|0)].push(r*COLS+c,(r+1)*COLS+c);
        }
      }
      for (let b=0; b<8; b++) {
        const batch = batches[b];
        if (!batch.length) continue;
        vc.beginPath(); vc.strokeStyle=PAL[b]; vc.lineWidth=b<2?.5:1;
        for (let k=0; k<batch.length; k+=2) {
          const pa=pts[batch[k]], pb=pts[batch[k+1]];
          if (pa&&pb) { vc.moveTo(pa.sx,pa.sy); vc.lineTo(pb.sx,pb.sy); }
        }
        vc.stroke();
      }
    }

    function getPos(e) {
      const rect = draw.getBoundingClientRect();
      return {
        x: (e.clientX-rect.left)*draw.width/rect.width,
        y: (e.clientY-rect.top)*draw.height/rect.height
      };
    }

    function doPaint(e) {
      const {x,y} = getPos(e);
      if      (activeTool==='raise-soft') applySoft(x,y, 1);
      else if (activeTool==='raise-hard') applyHard(x,y, 1);
      else if (activeTool==='erase')      applySoft(x,y,-1);
      else if (activeTool==='smooth')     applySmooth(x,y);
      else if (activeTool==='precise')    applyPrecise(x,y);
      syncDraw(); scheduleRender();
    }

    draw.addEventListener('mousedown', e => { painting=true; doPaint(e); });

    window.addEventListener('mousemove', e => {
      if (painting) {
        doPaint(e);
      } else {
        const rect=draw.getBoundingClientRect();
        updateHover(
          (e.clientX-rect.left)*draw.width/rect.width,
          (e.clientY-rect.top)*draw.height/rect.height
        );
      }
      if (vDragging) {
        vAngY+=(e.clientX-vLastX)*.008; vAngX+=(e.clientY-vLastY)*.008;
        vLastX=e.clientX; vLastY=e.clientY; scheduleRender();
      }
    });

    window.addEventListener('mouseup', () => { painting=false; vDragging=false; view.classList.remove('dragging'); });

    view.addEventListener('mousedown', e => { vDragging=true; vLastX=e.clientX; vLastY=e.clientY; view.classList.add('dragging'); });
    view.addEventListener('wheel', e => {
      e.preventDefault();
      vZoom=Math.max(1.5,Math.min(10,vZoom+e.deltaY*.004)); scheduleRender();
    }, {passive:false});

    // Controls
    document.getElementById('canvas-size').addEventListener('change', e => { initCanvas(+e.target.value); syncDraw(); });
    document.getElementById('grid-res').addEventListener('input', e => { document.getElementById('grid-val').textContent=e.target.value; initGrid(+e.target.value); });
    document.getElementById('brush-size').addEventListener('input', e => brushSize=+e.target.value);
    document.getElementById('strength').addEventListener('input',   e => strength=+e.target.value);
    document.getElementById('precise-h').addEventListener('input',  e => { precisionH=e.target.value/100; document.getElementById('precise-val').textContent=e.target.value+'%'; });
    document.getElementById('height-scale').addEventListener('input', e => { heightScale=e.target.value/10; geometryRevision+=1; scheduleRender(); });

    document.getElementById('toolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-tool]');
      if (!btn) return;
      activeTool = btn.dataset.tool;
      document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      showGrid = activeTool==='precise';
      document.getElementById('precise-row').hidden = activeTool!=='precise';
      drawGrid();
    });

    document.getElementById('btn-random').addEventListener('click', generateTerrain);
    document.getElementById('btn-clear').addEventListener('click',  () => { heights.fill(0); syncDraw(); scheduleRender(); });

    function createCurrentAsset() {
      const vertices=[];
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
        vertices.push([
          +((c/(COLS-1)-.5)*2).toFixed(5),
          +(heights[r*COLS+c]*heightScale).toFixed(5),
          +((r/(ROWS-1)-.5)*2).toFixed(5)
        ]);
      }
      return StudioCore.standardiseAsset({
        name: 'Sculpted relief',
        type: 'heightmap', rows:ROWS, cols:COLS, vertices,
        faces: StudioCore.gridFaces(ROWS, COLS),
        uvs: StudioCore.gridUvs(ROWS, COLS),
        metadata: { heightScale, gridResolution: ROWS, sourceTool: 'relief-sculptor', material: { type:'contour', primary:'#65cc88', secondary:'#14271b', scale:10, roughness:.72 } }
      });
    }

    document.getElementById('btn-export').addEventListener('click', () => {
      StudioCore.downloadJson('relief.json', createCurrentAsset());
    });

    function sendToWorld() {
      try {
        if (lastWorldSendRevision !== geometryRevision) {
          StudioCore.queueAsset(createCurrentAsset());
          lastWorldSendRevision = geometryRevision;
        }
        document.getElementById('transfer-status').textContent = 'Sent to World Builder. Keep sculpting or open World.';
        return true;
      } catch (error) {
        document.getElementById('transfer-status').textContent = error.message;
        return false;
      }
    }
    document.getElementById('btn-world').addEventListener('click', sendToWorld);
    document.getElementById('btn-world-open').addEventListener('click', () => { if (sendToWorld()) location.href='world.html'; });

    initCanvas(400); syncDraw(); resizeView();
  </script>
</body>
</html>
